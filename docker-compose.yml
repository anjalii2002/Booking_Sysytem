services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/coworking_booking
      JWT_ACCESS_SECRET: change_this_to_a_long_random_access_secret
      JWT_REFRESH_SECRET: change_this_to_a_different_long_random_refresh_secret
      CLIENT_URL: http://localhost:8080
    depends_on:
      - mongodb
    ports:
      - "5000:5000"

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  mongo-data:
